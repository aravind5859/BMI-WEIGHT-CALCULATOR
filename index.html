<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>
<body>
    <div class="container">
        <h1>BMI Calculator</h1>
        <div class="input-group">
            <div>
                <label>Weight (kg)</label>
                <input type="number" id="weight" placeholder="Enter weight">
            </div>
            <div>
                <label>Height (cm)</label>
                <input type="number" id="height" placeholder="Enter height">
            </div>
        </div>
        
        <div class="result">
            <h2 id="bmi-value">--</h2>
            <p id="bmi-category">Category</p>
        </div>

        <div class="bmi-scale">
            <div class="scale underweight"></div>
            <div class="scale normal"></div>
            <div class="scale overweight"></div>
            <div class="scale obese"></div>
        </div>
        <p class="bmi-labels">
            <span>Underweight</span>
            <span>Normal</span>
            <span>Overweight</span>
            <span>Obese</span>
        </p>

        <div class="buttons">
            <button onclick="resetBMI()" class="reset">Reset</button>
            <button onclick="calculateBMI()" class="calculate">Calculate</button>
        </div>

        <!-- Weight Loss Tips Section -->
        <div id="tips-container">
            <h3>Health Tips</h3>
            <p id="health-tips">Enter your weight & height to get tips.</p>
        </div>
    </div>
</body>
</html>
